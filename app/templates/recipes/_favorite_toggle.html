{% macro favorite_toggle(recipe, is_favorite) -%}
<button
  class="favorite-toggle"
  type="button"
  data-favorite-button
  data-favorite-variant="icon"
  data-favorite-known="{{ 'true' if is_favorite else 'false' }}"
  data-recipe-id="{{ recipe.id }}"
  data-recipe-title="{{ recipe.title }}"
  aria-label="{{ t('recipe.favorite_remove', title=recipe.title) if is_favorite else t('recipe.favorite_add', title=recipe.title) }}"
  aria-pressed="{{ 'true' if is_favorite else 'false' }}"
  title="{{ t('recipe.favorite_remove_short') if is_favorite else t('recipe.favorite_add_short') }}"
>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true" focusable="false">
    <path d="M11.53 2.3a.53.53 0 0 1 .95 0l2.31 4.67a2.12 2.12 0 0 0 1.59 1.16l5.16.75a.53.53 0 0 1 .3.91l-3.74 3.64a2.12 2.12 0 0 0-.61 1.87l.88 5.14a.53.53 0 0 1-.77.56l-4.62-2.43a2.12 2.12 0 0 0-1.97 0L6.4 21a.53.53 0 0 1-.77-.56l.88-5.14a2.12 2.12 0 0 0-.61-1.87L2.16 9.79a.53.53 0 0 1 .3-.91l5.16-.75a2.12 2.12 0 0 0 1.59-1.16z"/>
  </svg>
</button>
{%- endmacro %}
