name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine3.24@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_DB: recipe_test
          POSTGRES_USER: recipe
          POSTGRES_PASSWORD: recipe
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U recipe -d recipe_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:8.10.1-alpine3.23@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_ENV: test
      APP_SECRET_KEY: test-only-secret-key-with-more-than-thirty-two-chars
      APP_BASE_URL: http://testserver
      DATABASE_URL: postgresql+psycopg://recipe:recipe@localhost:5432/recipe_test
      REDIS_URL: redis://localhost:6379/15
      STORAGE_ROOT: /tmp/recipe-test-storage
      BACKUP_TEMP_ROOT: /tmp/recipe-test-backups
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
          cache: npm
      - name: Aktuelles npm mit gepatchten gebündelten Abhängigkeiten installieren
        run: |
          npm install --global --ignore-scripts npm@12.0.2
          npm install --prefix "$RUNNER_TEMP/npm-security-patches" --no-save \
            --ignore-scripts --no-audit \
            brace-expansion@5.0.9 ip-address@10.3.1 tar@7.5.21
          npm_modules="$(npm root --global)/npm/node_modules"
          rm -rf \
            "$npm_modules/brace-expansion" \
            "$npm_modules/ip-address" \
            "$npm_modules/tar"
          cp -a "$RUNNER_TEMP/npm-security-patches/node_modules/brace-expansion" "$npm_modules/"
          cp -a "$RUNNER_TEMP/npm-security-patches/node_modules/ip-address" "$npm_modules/"
          cp -a "$RUNNER_TEMP/npm-security-patches/node_modules/tar" "$npm_modules/"
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: pip install --require-hashes -r requirements-dev.lock
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - run: alembic upgrade head
      - run: python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=75
      - run: pip-audit
      - run: docker compose config --quiet

  browser-e2e:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      COMPOSE_FILE: docker-compose.yml:.github/compose.e2e.yml
      COMPOSE_PROJECT_NAME: recipes-e2e
      PUBLIC_PORT: "18080"
      E2E_BASE_URL: http://127.0.0.1:18080
      E2E_REQUIRED: "1"
      E2E_ALLOW_RESTORE: "1"
      E2E_ADMIN_EMAIL: e2e-admin@example.test
      E2E_ADMIN_PASSWORD: E2E-Admin-Sentinel-7zQ4pL9vN2xK
      E2E_MEMBER_EMAIL: e2e-member@example.test
      E2E_MEMBER_PASSWORD: E2E-Member-Sentinel-4mR8wC6yH3sF
      E2E_APP_SECRET_KEY: 2d87f0a4c5e14916b83a76750ef2902f90f742ea8fe94e119f96452c97b88f05
      E2E_RENDERER_TOKEN: 7ba607086bac4c05bf6a0fb50d8bd41bdc35ae3ba3b44257b619346083770b15
      E2E_POSTGRES_PASSWORD: E2EDatabaseSentinel8n5c2w7r4k9m
      E2E_SECRET_SENTINELS: "2d87f0a4c5e14916b83a76750ef2902f90f742ea8fe94e119f96452c97b88f05|7ba607086bac4c05bf6a0fb50d8bd41bdc35ae3ba3b44257b619346083770b15|E2EDatabaseSentinel8n5c2w7r4k9m"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
          cache: pip
      - run: pip install --require-hashes -r requirements-dev.lock
      - run: playwright install --with-deps chromium
      - run: docker compose config --quiet
      - name: Finale Container-Images bauen und scannen
        run: ./scripts/scan-images.sh
      - run: docker compose up --detach --wait
      - name: Nur den Reverse-Proxy veröffentlichen und Runtime prüfen
        run: |
          test "$(docker inspect --format '{{len .HostConfig.PortBindings}}' "$(docker compose ps -q proxy)")" -eq 1
          for service in app worker renderer egress db redis; do
            test "$(docker inspect --format '{{len .HostConfig.PortBindings}}' "$(docker compose ps -q "$service")")" -eq 0
          done
          curl --fail --retry 10 --retry-delay 1 "$E2E_BASE_URL/health/ready"
      - name: Browser-Testkonten anlegen
        run: |
          printf '%s\n%s\n' "$E2E_ADMIN_PASSWORD" "$E2E_ADMIN_PASSWORD" \
            | docker compose exec -T app python -m app.cli users create \
                --email "$E2E_ADMIN_EMAIL" --display-name "E2E Admin" --role admin
          printf '%s\n%s\n' "$E2E_MEMBER_PASSWORD" "$E2E_MEMBER_PASSWORD" \
            | docker compose exec -T app python -m app.cli users create \
                --email "$E2E_MEMBER_EMAIL" --display-name "E2E Mitglied" --role member
      - name: Browser-Flows ohne Restore
        run: >-
          python -m pytest -m e2e tests/test_e2e.py
          -k 'not test_full_backup_and_restore_round_trip'
          --tracing=retain-on-failure
          --video=retain-on-failure
          --screenshot=only-on-failure
          --output=test-results/e2e-main
      - name: Destruktiver Restore-Roundtrip deterministisch zuletzt
        run: >-
          python -m pytest -m e2e
          tests/test_e2e.py::test_full_backup_and_restore_round_trip
          --tracing=retain-on-failure
          --video=retain-on-failure
          --screenshot=only-on-failure
          --output=test-results/e2e-restore
      - name: Container-Logs bei Fehlern
        if: failure()
        run: |
          mkdir -p test-results
          docker compose logs --no-color > test-results/container.log
          docker compose ps --all > test-results/containers.txt
      - name: Browser-Artefakte bei Fehlern hochladen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: warn
          retention-days: 14
      - name: Stack immer entfernen
        if: always()
        run: docker compose down --volumes --remove-orphans
