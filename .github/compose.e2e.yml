x-e2e-application-environment: &e2e-application-environment
  APP_ENV: test
  APP_SECRET_KEY: "${E2E_APP_SECRET_KEY:?E2E_APP_SECRET_KEY fehlt}"
  APP_BASE_URL: "${E2E_BASE_URL:?E2E_BASE_URL fehlt}"
  ALLOWED_HOSTS: "127.0.0.1,localhost"
  FORCE_HTTPS: "false"
  SESSION_COOKIE_SECURE: "false"
  DATABASE_URL: "postgresql+psycopg://recipe:${E2E_POSTGRES_PASSWORD:?E2E_POSTGRES_PASSWORD fehlt}@db:5432/recipe"
  RENDERER_TOKEN: "${E2E_RENDERER_TOKEN:?E2E_RENDERER_TOKEN fehlt}"
  AI_API_KEY: ""
  AI_IMAGE_GENERATION_ENABLED: "false"
  STORAGE_MIN_FREE_MB: "64"

services:
  app:
    environment: *e2e-application-environment
  worker:
    environment: *e2e-application-environment
  renderer:
    environment:
      RENDERER_TOKEN: "${E2E_RENDERER_TOKEN:?E2E_RENDERER_TOKEN fehlt}"
  db:
    environment:
      POSTGRES_DB: recipe
      POSTGRES_USER: recipe
      POSTGRES_PASSWORD: "${E2E_POSTGRES_PASSWORD:?E2E_POSTGRES_PASSWORD fehlt}"
