[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "rezeptverwaltung"
version = "1.0.0"
description = "Private, gemeinsam genutzte Rezeptverwaltung"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "docs/DEPENDENCY_LICENSES.md"]
dependencies = [
  "alembic>=1.14,<2",
  "argon2-cffi>=23.1,<26",
  "dramatiq[redis]>=1.17,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "orjson>=3.10,<4",
  "pillow>=11,<13",
  "pillow-heif>=0.21,<2",
  "playwright>=1.51,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "pypdfium2>=5.13,<6",
  "python-multipart>=0.0.20,<1",
  "redis>=5,<7",
  "sqlalchemy>=2.0.36,<3",
  "typer>=0.15,<1",
  "tzdata>=2025.2",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pip-audit>=2.7,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<8",
  "pytest-playwright>=0.6,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
rezepte = "app.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "integration: benötigt PostgreSQL und Redis",
  "e2e: benötigt den vollständigen Docker-Stack",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "C4", "SIM"]
ignore = ["S101", "B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S105", "S106", "S311"]
"app/config.py" = ["S105"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
