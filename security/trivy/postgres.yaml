vulnerabilities:
  - id: CVE-2026-14456
    purls:
      - "pkg:apk/alpine/libcrypto3"
      - "pkg:apk/alpine/libssl3"
      - "pkg:deb/debian/libssl3t64"
      - "pkg:deb/debian/openssl"
      - "pkg:deb/debian/openssl-provider-legacy"
    expired_at: 2026-12-03
    statement: PostgreSQL does not create an OpenSSL QUIC listener; the affected code is not invoked.
  - id: CVE-2025-68121
    paths: &gosu_path
      - "usr/local/bin/gosu"
    expired_at: &review_date 2026-12-03
    statement: &gosu_statement The finding is confined to the startup-only gosu helper; none of the affected standard-library APIs are reachable from its user-switch and exec path.
